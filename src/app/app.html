@if(results$ | async; as results)
{
  @for(result of results; track result.id)
    {
      <div>
        <ul>
          <li>Here is the id: {{result.id}}</li>
          <li><a [href]="result.html_url" target="_blank" rel="noopener noreferrer">{{ result.name }}</a></li>
          <li>{{result.description}}</li>
        </ul>
      </div>
      
    }
}

@else() {
  <p>There's nothing here, dawg.</p>
}
